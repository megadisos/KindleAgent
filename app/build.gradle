plugins {
    id 'com.android.application'
}

android {
    namespace 'com.megadisos.jarvis'
    compileSdk 34

    defaultConfig {
        applicationId 'com.megadisos.jarvis'
        // Fire 7 (2019+) runs Fire OS 7/8, based on Android 9/11.
        minSdk 22
        targetSdk 34
        versionCode 12
        versionName '0.10.0'
    }

    signingConfigs {
        // Fixed debug key committed to the repo so every CI build can be
        // installed over the previous one without uninstalling.
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
