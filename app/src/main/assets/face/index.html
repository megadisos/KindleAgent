<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Jarvis</title>
<link rel="stylesheet" href="face.css">
</head>
<body>
  <canvas id="face"></canvas>
  <div id="status">Toca la cara para hablar</div>
  <button id="gear" aria-label="Configuración">⚙</button>
  <div id="badge" hidden>✎ Modo edición</div>

  <div id="settings" hidden>
    <form id="settings-form">
      <h1>Configuración</h1>

      <h2>Conexión con el PC</h2>
      <p>Escribe lo que muestra la ventana de Jarvis en tu PC.</p>
      <div class="row">
        <label class="grow">IP del PC
          <input id="host" inputmode="decimal" autocomplete="off" placeholder="192.168.1.20">
        </label>
        <label class="small">Puerto
          <input id="port" inputmode="numeric" autocomplete="off" placeholder="8737">
        </label>
      </div>
      <label>Código
        <input id="code" inputmode="numeric" autocomplete="off" placeholder="123456">
      </label>

      <h2>Cerebro</h2>
      <label>Modelo de Claude
        <select id="model">
          <option value="haiku">Haiku: el más rápido</option>
          <option value="sonnet">Sonnet: equilibrado</option>
          <option value="opus">Opus: el más inteligente (más lento)</option>
        </select>
      </label>
      <label class="check">
        <input type="checkbox" id="edit">
        <span><b>Modo edición</b>: puede modificar tus proyectos editables y crear proyectos nuevos. Te pregunta antes de cambiar algo.</span>
      </label>
      <label class="check" id="shell-row">
        <input type="checkbox" id="shell">
        <span><b>Terminal</b>: además puede ejecutar comandos en el PC (instalar paquetes, git, etc.). Te dice cada comando y espera tu "sí". Solo con modo edición.</span>
      </label>

      <h2>Voz</h2>
      <label>Tono <span id="pitch-val"></span>
        <input type="range" id="pitch" min="0.5" max="1.5" step="0.05">
      </label>
      <label>Velocidad <span id="rate-val"></span>
        <input type="range" id="rate" min="0.5" max="1.6" step="0.05">
      </label>
      <button type="button" id="preview" class="link">▶ Probar voz</button>

      <div id="settings-msg" role="status"></div>
      <div class="buttons">
        <button type="button" id="cancel">Cerrar</button>
        <button type="submit" id="save">Guardar</button>
      </div>
    </form>
  </div>

  <script src="face.js"></script>
</body>
</html>
